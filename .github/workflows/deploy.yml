name: Deploy to GitHub Pages

on:
  push:
    branches: [ aster ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install aster
        uses: baptiste0928/cargo-install@v3
        with:
          crate: aster-ssg
          version: 0.3.0
      - name: Cache Lumis syntax files
        uses: actions/cache@v4
        with:
          path: ~/.cache/aster/lumis
          key: ${{ runner.os }}-aster-lumis-${{ hashFiles('aster.toml') }}
          restore-keys: |
            ${{ runner.os }}-aster-lumis-
      - name: Build
        run: aster build
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
