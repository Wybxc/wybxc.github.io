[project]
name = "wybxc-blog"

[site]
title = "Jiayi Zhuang’s Blog"
description = "Jiayi Zhuang’s personal blog and academic portfolio."
url = "https://blog.wybxc.cc/"
language = "en"
author = "Jiayi Zhuang"

[assets]
image-inline-threshold = 0

[assets.images]
frame-density = 2

[typst.fonts]
paths = ["assets/fonts"]
system = true

[[postprocess]]
name = "mathml-svg-semantics"
command = [
  "deno",
  "run",
  "--allow-read",
  "--allow-write",
  "scripts/postprocess-mathml.ts",
  "{site}",
]
watch = ["scripts/postprocess-mathml.ts"]
